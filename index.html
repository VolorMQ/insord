<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<title>Dansk Strukturtræner — Полный</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1e1e1e, #2f2f2f);
  color: #f0f0f0;
  display: flex;
  justify-content: center;
  padding: 20px;
}
.wrapper {
  display: flex;
  gap: 20px;
  max-width: 1200px;
  width: 100%;
}
.trainer {
  background: #222;
  padding: 20px;
  border-radius: 12px;
  flex: 2;
}
.rulesBox {
  background: #333;
  padding: 15px;
  border-radius: 12px;
  flex: 1;
  font-size: 14px;
  line-height: 1.6;
}
.option {
  background: #444;
  margin: 6px 0;
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}
.option:hover { background: #555; }
.correct { background: #2e7d32 !important; }
.wrong { background: #c62828 !important; }
button {
  background: #ff5555;
  border: none;
  padding: 10px 20px;
  margin-top: 10px;
  border-radius: 8px;
  cursor: pointer;
  color: #fff;
  font-weight: bold;
}
#liveStats { margin-top: 15px; font-size: 14px; opacity: 0.9; }
#loader { text-align: center; max-width: 800px; }
.formula {
  background: #444;
  margin: 8px 0;
  padding: 10px;
  border-radius: 8px;
  text-align: left;
  font-size: 13px;
  white-space: pre-wrap;
}
</style>
</head>
<body>

<div id="loader">
  <h2>Загрузка заданий...</h2>
  <h2>Выберите набор заданий:</h2>
  <div id="jsonList"></div>
  <br>
  <p>Если загрузка не сработает, выберите JSON файл:</p>
  <input type="file" id="jsonFile" accept=".json"><br>
  <button id="startBtn">Начать вручную</button>
  <br><br>
  <button id="startExamBtn">Начать экзамен</button>
  <br><br>
  <!-- Кнопка для работы с текстом -->
  <button id="textWorkBtn">Работать с текстом (слова)</button>
  <button id="textWorkBtn1">Работать с текстом (предложения)</button>
  <hr>
  <h3>Все формулы:</h3>
  <div id="allFormulas"></div>
</div>

<div class="wrapper" id="game" style="display:none;">
  <div class="trainer">
    <div id="question"></div>
    <div id="options"></div>
    <div id="progress"></div>
    <div id="liveStats"></div>
    <button id="examBtnInGame">Экзамен</button>
  </div>

  <div class="rulesBox">
    <h3>Правило</h3>
    <div id="ruleText"></div>
  </div>
</div>

<script>
let levels = [];       // обычные задания (формулы 1–6)
let examLevels = [];   // экзамен (формула 99)
let current = 0;
let stats = { correct: 0, wrong: 0, byFormula: {} };
let selectedFile = null;
let loadedData = null;

const rules = {
  1: `
🟢 Формула 1  
er / bliver = состояние и изменение состояния

"er" и "bliver" — связующие глаголы. Они не описывают действие, а связывают подлежащее с его характеристикой.
- "er" = текущее состояние или свойство;
- "bliver" = переход в новое состояние.

После "er" или "bliver" обычно стоит прилагательное или существительное, которое даёт смысл предложению.

Ключевые слова: er, bliver, sjov, spændende, hyggelig
`,

  2: `
🔵 Формула 2  
vil / kan / skal / må = модальные глаголы

vil, kan, skal, må показывают отношение к действию: желание, способность, обязанность, разрешение или необходимость.
После модального глагола идёт основной глагол в инфинитиве (без "at").

Ключевые слова: vil, kan, skal, må
`,

  3: `
🟣 Формула 3  
at / fordi / hvorfor = структура придаточного предложения

at, fordi, hvorfor и другие вводят придаточные предложения.
В придаточном предложении порядок слов отличается: отрицание "ikke" ставится перед главным глаголом, а спрягаемый глагол часто смещается к концу.

Ключевые слова: at, fordi, hvorfor, når, hvis, da, hvor, mens, der, som, om, ikke
`,

  4: `
🟡 Формула 4  
for / fordi / men = логическая связь

"for" и "fordi" связывают утверждение с причиной (почему), "men" показывает контраст (но).
Эти союзы помогают строить сложные фразы: причина → следствие или утверждение → противопоставление.

Ключевые слова: for, fordi, men
`,

  5: `
🟠 Формула 5  
til / for + at + глагол = цель действия

"til" или "for" могут вводить цель через конструкцию "til/for + at + инфинитив".
"Аt" здесь передаёт инфинитив (то, что хотят сделать).
Важно различать, когда "til/for" требуют существительного, а когда инфинитивной конструкции.

Ключевые слова: til at, for at, spille, træne, dyrke
`,

  6: `
🟤 Формула 6  
глагол в конце придаточной части

В придаточных предложениях спрягаемый глагол стоит после подлежащего и всех элементов; часто глагол оказывается ближе к концу.
Это главный признак придаточного: порядок слов отличается от главного предложения.

Ключевые слова: træne, spille, dyrke, er, bliver, har, kan, skal, vil, ikke
`,

  7: `
🔹 Формула 7 — порядок после наречий времени и места

Наречия времени и места (когда/где) обычно ставятся в начале или середине предложения.
После наречия идёт подлежащее, затем сказуемое. Если есть модальный или вспомогательный глагол, основной глагол может смещаться в конец.

Ключевые слова: i biografen, i weekenden, efter arbejde, hurtigt
`,

  8: `
🔹 Формула 8 — отрицание с ikke

"ikke" = не. В главном предложении "ikke" ставится после спрягаемого глагола.
В придаточном предложении "ikke" обычно стоит перед основным глаголом (после вводного слова типа at/fordi).

Ключевые слова: ikke
`,

  9: `
🔹 Формула 9 — выбор между en / et / flere / mange

"en" — для общего рода, "et" — для среднего рода, "flere" = несколько, "mange" = много.
После этих слов идёт существительное.

Ключевые слова: en, et, flere, mange
`,

  10: `
🔹 Формула 10 — согласование времен (tidsmæssig kongruens)

Главное и придаточное должны согласовываться по времени:
- Если главное в прошедшем — придаточное тоже в прошедшем;
- Если главное в настоящем — придаточное тоже в настоящем.

Ключевые слова: nutid, datid
`
};

function showAllFormulas() {
  const container = document.getElementById("allFormulas");
  for (const key in rules) {
    const div = document.createElement("div");
    div.style.background = "#444";
    div.style.margin = "6px 0";
    div.style.padding = "10px";
    div.style.borderRadius = "8px";
    div.style.fontSize = "13px";
    div.innerHTML = `<strong>Формула ${key}:</strong><br>${rules[key].replace(/\n/g, "<br>")}`;
    container.appendChild(div);
  }
}

// Показываем формулы сразу при загрузке страницы
window.addEventListener("load", () => {
  showAllFormulas();
  loadJSONFromServer();
});

// ===== Кнопка для открытия test.html =====
document.getElementById("textWorkBtn").onclick = () => {
  window.location.href = "test.html";
};
// ===== Кнопка для открытия test1.html =====
document.getElementById("textWorkBtn1").onclick = () => {
  window.location.href = "test1.html";
};


const files = [
  "1.json",
  "2.json",
  "3.json",
  "4.json"
];

// ===== Перемешивание =====
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// ===== Автозагрузка JSON =====
function loadJSONFromServer() {
  const jsonList = document.getElementById("jsonList");
  const startBtn = document.getElementById("startExamBtn");
  const examBtn = document.getElementById("examBtnInGame");

  // Очищаем контейнер перед созданием кнопок
  jsonList.innerHTML = "";

  files.forEach(file => {
    const btn = document.createElement("div");
    btn.className = "option";
    btn.textContent = file.split("/").pop();

    btn.onclick = () => {
      selectedFile = file;

      document.querySelectorAll("#jsonList .option").forEach(o => o.classList.remove("correct"));
      btn.classList.add("correct");

      fetch(selectedFile)
        .then(res => res.json())
        .then(data => {
          loadedData = data;
          startBtn.disabled = false;
          examBtn.disabled = false;
          initGame(loadedData, false);
        })
        .catch(err => {
          loadedData = null;
          startBtn.disabled = true;
          examBtn.disabled = true;
          alert("Ошибка загрузки JSON: " + err);
        });
    };

    jsonList.appendChild(btn);
  });

  startBtn.addEventListener("click", () => {
    if (!loadedData) return;
    initGame(loadedData, true);
  });
}


// ===== Ручная загрузка JSON =====
document.getElementById("startBtn").onclick = () => {
  const fileInput = document.getElementById("jsonFile");
  if (!fileInput.files[0]) return alert("Выберите JSON файл");

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);

      // разделяем обычные задания и экзамен
      levels = shuffle(data.filter(q => q.formula >= 1 && q.formula <= 6));
      examLevels = shuffle(data.filter(q => q.formula === 99));
      current = 0;
      stats = { correct: 0, wrong: 0, byFormula: {} };

      // сразу запускаем обучение
      document.getElementById("loader").style.display = "none";
      document.getElementById("game").style.display = "flex";
      showQuestion(false); // false = обычное обучение
    } catch (err) {
      alert("Ошибка в формате JSON: " + err.message);
    }
  };
  reader.readAsText(fileInput.files[0]);
};

// ===== Кнопка экзамена во время обучения =====
document.getElementById("examBtnInGame").onclick = () => {
  if (!examLevels.length) {
    alert("⚠ Заданий для экзамена нет в этом JSON");
    return;
  }

  // сбрасываем прогресс и статистику для экзамена
  current = 0;
  stats = { correct: 0, wrong: 0, byFormula: { 99: { correct: 0, wrong: 0 } } };

  document.getElementById("loader").style.display = "none";
  document.getElementById("game").style.display = "flex";

  // показываем вопросы экзамена
  showQuestion(true); // true = экзамен
};

// ===== Инициализация игры =====
function initGame(data, isExam = false) {
  levels = shuffle(data.filter(q => q.formula >= 1 && q.formula <= 6));
  examLevels = shuffle(data.filter(q => q.formula === 99));
  current = 0;
  stats = { correct: 0, wrong: 0, byFormula: {} };

  // Скрываем стартовый экран
  document.getElementById("loader").style.display = "none";
  document.getElementById("game").style.display = "flex";

  // Скрываем все формулы после начала игры
  setTimeout(() => {
    const allFormulas = document.getElementById("allFormulas");
    if (allFormulas) allFormulas.style.display = "none";
  }, 50); // небольшой таймаут гарантирует, что элемент уже добавлен в DOM

  // Показываем первый вопрос
  showQuestion(isExam);
}


// ===== Показ вопроса =====
function showQuestion(isExam = false) {
  const source = isExam ? examLevels : levels;
  const q = source[current];
  if (!q) {
    showEnd(isExam);
    return;
  }

  document.getElementById("question").innerHTML = "<h2>" + q.question + "</h2>";

  // показываем правило только для обычных заданий
  document.getElementById("ruleText").innerText =
    (!isExam && q.formula !== 99) ? (rules[q.formula] || "") : "";

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";
  shuffle([...q.options]).forEach(opt => {
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = opt;
    div.onclick = () => checkAnswer(opt, div, q, isExam, source);
    optionsDiv.appendChild(div);
  });

  document.getElementById("progress").innerText = `Вопрос ${current + 1} из ${source.length}`;
  updateLiveStats(q.formula);
}

// ===== Проверка ответа =====
function checkAnswer(selected, btn, q, isExam = false, source = null) {
  const correct = q.answer;
  const optionsDiv = document.getElementById("options");

  if (!stats.byFormula[q.formula]) stats.byFormula[q.formula] = { correct: 0, wrong: 0 };

  if (selected === correct) {
    btn.classList.add("correct");
    stats.correct++;
    stats.byFormula[q.formula].correct++;
  } else {
    btn.classList.add("wrong");
    stats.wrong++;
    stats.byFormula[q.formula].wrong++;
    if (!isExam) {
      Array.from(optionsDiv.children).forEach(c => {
        if (c.innerText === correct) c.classList.add("correct");
      });
    }
  }

  updateLiveStats(q.formula);

  setTimeout(() => {
    current++;
    const arr = source || levels;
    if (current < arr.length) showQuestion(isExam);
    else showEnd(isExam);
  }, 900);
}

// ===== Статистика =====
function updateLiveStats(curFormula) {
  const total = stats.correct + stats.wrong;
  const percentage = total ? Math.round((stats.correct / total) * 100) : 0;
  const f = stats.byFormula[curFormula] || { correct: 0, wrong: 0 };
  document.getElementById("liveStats").innerHTML = `
    <hr>
    ✔ Правильно: ${stats.correct} |
    ❌ Ошибок: ${stats.wrong} |
    📊 ${percentage}%<br>
    Формула ${curFormula}: ✔${f.correct} | ❌${f.wrong}
  `;
}

// ===== Конец игры =====
function showEnd(isExam = false) {
  document.querySelector(".trainer").innerHTML = `
    <h2>${isExam ? "Экзамен завершён! 🎓" : "Готово! 🎉"}</h2>
    <p>Правильно: ${stats.correct}</p>
    <p>Ошибок: ${stats.wrong}</p>
    <button onclick="location.reload()">Снова</button>
  `;
  document.getElementById("ruleText").innerText = "";
}

// ===== Автозагрузка при старте страницы =====
window.addEventListener("load", () => {
  loadJSONFromServer();
});
</script>

</body>
</html>
